[package]
name = "bbx_plugin"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Plugin integration crate for bbx_audio DSP library with C FFI bindings"
readme = "README.md"
keywords = ["audio", "plugin", "ffi", "vst", "juce"]
categories = ["multimedia::audio", "external-ffi-bindings"]
links = "bbx_plugin"

[lib]
crate-type = ["rlib"]

[features]
default = ["std"]
# bbx_plugin is inherently std (FFI, serde_json); this feature exists so the
# no_std lattice in bbx_core/bbx_dsp/bbx_midi cannot starve `PluginDsp` (which
# is std-gated in bbx_dsp) when a consumer disables `simd`.
std = ["bbx_core/std", "bbx_dsp/std", "bbx_midi/std"]
ftz-daz = ["bbx_core/ftz-daz", "bbx_dsp/ftz-daz"]
simd = ["bbx_core/simd", "bbx_dsp/simd"]

[dependencies]
bbx_core.workspace = true
bbx_dsp.workspace = true
bbx_midi = { workspace = true, default-features = false }

serde.workspace = true
serde_json.workspace = true
