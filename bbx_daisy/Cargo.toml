[package]
name = "bbx_daisy"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Electrosmith Daisy hardware support for bbx_audio"
readme = "README.md"
keywords = ["audio", "dsp", "embedded", "daisy", "stm32"]
categories = ["embedded", "hardware-support", "no-std"]

# Exclude dev-only embedded tooling from the published package: .cargo/config.toml pins the
# ARM target, which would hijack the host-side `cargo publish` verify build; scripts/ is
# repo-local flashing. memory.x and build.rs MUST stay (build.rs does include_bytes!("memory.x")).
exclude = [".cargo/", "scripts/"]

[dependencies]
bbx_core = { workspace = true }
bbx_dsp = { workspace = true, default-features = false }

# Embedded HAL traits (platform-independent)
# Using 0.2 for compatibility with stm32h7xx-hal 0.16
embedded-hal = "0.2"

# Math library for no_std
libm = "0.2"

# Embedded HAL (only for ARM Cortex-M targets)
[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
stm32h7xx-hal = { version = "0.16", features = ["stm32h750v", "rt", "xspi", "fmc"] }
stm32-fmc = "0.3"
panic-halt = "1.0"

[[example]]
name = "01_blink"
required-features = ["seed"]

[[example]]
name = "02_oscillator"
required-features = ["seed"]

[[example]]
name = "03_filter_knob"
required-features = ["seed"]

[[example]]
name = "04_simple_synth"
required-features = ["seed"]

[[example]]
name = "05_pod_synth"
required-features = ["pod"]

[[example]]
name = "06_board_id"
required-features = ["seed"]

[[example]]
name = "07_clock_check"
required-features = ["seed"]

[[example]]
name = "08_cycle_check"
required-features = ["seed"]

[features]
default = ["seed"]

# Daisy Seed variants
seed = []
seed_1_1 = []
seed_1_2 = []

# Daisy Pod
pod = []

# Patch family
patch_sm = []
patch_init = ["patch_sm"]  # Patch.Init uses Patch SM hardware
patch = ["patch_sm"]       # Alias for Patch SM

# Field (not yet implemented)
field = []

# Audio configuration
sampling_rate_96khz = []  # Use 96kHz instead of default 48kHz (unverified on hardware for the I2C codecs — see codec.rs)
block_length_64 = []      # Use 64 sample block size instead of default 48

# Enable the CPU I/D caches and the DMA-buffer cache maintenance (invalidate/clean) in the audio
# path, matching the reference daisy crate. OFF by default: the D-cache stays disabled and the
# DMA buffers are coherent without maintenance. These MUST be toggled together — running the
# cache-maintenance ops with the D-cache disabled raises an imprecise BusFault on the STM32H750.
dcache = []
